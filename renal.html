<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Renal Outline Quiz</title>
  <style>
    :root {
      --ink: #101410;
      --paper: #f7efe0;
      --cream: #fff9ee;
      --green: #0f3b2f;
      --sage: #c9ddb8;
      --gold: #f4aa19;
      --red: #b94a34;
      --blue: #243f70;
      --muted: rgba(16, 20, 16, 0.68);
      --shadow: 12px 12px 0 rgba(15, 59, 47, 0.92), 0 24px 70px rgba(15, 59, 47, 0.22);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at 14% 16%, rgba(244, 170, 25, 0.34), transparent 28%),
        radial-gradient(circle at 86% 12%, rgba(36, 63, 112, 0.17), transparent 28%),
        linear-gradient(135deg, #fbf4e7, #dcc596);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.18;
      background-image:
        linear-gradient(90deg, rgba(15,59,47,.14) 1px, transparent 1px),
        linear-gradient(rgba(15,59,47,.1) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: radial-gradient(circle at center, black, transparent 80%);
    }

    .shell {
      position: relative;
      width: min(1120px, calc(100vw - 30px));
      margin: 0 auto;
      padding: 26px 0 34px;
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: end;
      margin-bottom: 24px;
    }

    .eyebrow {
      margin: 0 0 8px;
      font: 800 12px/1 "Trebuchet MS", sans-serif;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--red);
    }

    h1 {
      margin: 0;
      color: var(--green);
      font-size: clamp(38px, 7vw, 78px);
      line-height: .88;
      letter-spacing: -.055em;
    }

    .score-card {
      min-width: 220px;
      padding: 15px 18px;
      border: 2px solid var(--green);
      background: rgba(255, 249, 238, .75);
      box-shadow: 8px 8px 0 var(--green);
      text-align: right;
      font: 900 13px/1.4 "Trebuchet MS", sans-serif;
      text-transform: uppercase;
      letter-spacing: .09em;
    }

    .quiz-nav {
      grid-column: 1 / -1;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      font: 900 12px/1 "Trebuchet MS", sans-serif;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .quiz-nav a {
      border: 2px solid var(--green);
      border-radius: 999px;
      padding: 10px 12px;
      background: rgba(255,249,238,.75);
      color: var(--green);
      text-decoration: none;
      box-shadow: 4px 4px 0 rgba(15,59,47,.22);
    }

    .quiz-nav a[aria-current="page"] {
      background: var(--green);
      color: var(--paper);
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 24px;
      align-items: start;
    }

    .quiz-card {
      border: 3px solid var(--green);
      border-radius: 30px;
      min-height: 610px;
      padding: clamp(24px, 4vw, 48px);
      background:
        linear-gradient(145deg, rgba(255,255,255,.65), transparent 34%),
        repeating-linear-gradient(0deg, rgba(15,59,47,.055) 0 1px, transparent 1px 22px),
        var(--paper);
      box-shadow: var(--shadow);
      overflow: hidden;
      position: relative;
    }

    .quiz-card::after {
      content: "RENAL";
      position: absolute;
      right: -24px;
      bottom: -28px;
      font: 900 clamp(78px, 15vw, 144px)/1 "Trebuchet MS", sans-serif;
      letter-spacing: -.1em;
      color: rgba(15,59,47,.055);
      pointer-events: none;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
      font: 900 12px/1 "Trebuchet MS", sans-serif;
      letter-spacing: .13em;
      text-transform: uppercase;
      color: var(--blue);
    }

    .chip {
      border: 2px solid currentColor;
      border-radius: 999px;
      padding: 7px 10px;
      background: rgba(244,170,25,.18);
    }

    .question {
      margin: 0 0 24px;
      color: var(--green);
      font-size: clamp(28px, 4.5vw, 54px);
      line-height: .98;
      letter-spacing: -.045em;
      max-width: 900px;
    }

    .choices {
      display: grid;
      gap: 12px;
      position: relative;
      z-index: 1;
    }

    .choice {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 13px;
      align-items: center;
      width: 100%;
      border: 2px solid var(--green);
      border-radius: 18px;
      padding: 15px 16px;
      background: rgba(255,249,238,.72);
      color: var(--ink);
      font: 800 16px/1.25 "Trebuchet MS", sans-serif;
      text-align: left;
      cursor: pointer;
      box-shadow: 5px 5px 0 rgba(15,59,47,.28);
      transition: transform 120ms ease, box-shadow 120ms ease, background 120ms ease;
    }

    .choice:hover:not(:disabled) {
      transform: translate(-1px, -1px);
      box-shadow: 7px 7px 0 rgba(15,59,47,.28);
      background: #fffaf0;
    }

    .choice:disabled { cursor: default; }
    .choice.correct { background: #dff0cf; border-color: #1f6c3d; }
    .choice.wrong { background: #f2c9bd; border-color: var(--red); }

    .letter {
      display: inline-grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--green);
      color: var(--paper);
      font-size: 13px;
    }

    .feedback {
      display: none;
      position: relative;
      z-index: 1;
      margin-top: 22px;
      border: 2px solid var(--green);
      border-radius: 18px;
      padding: 16px;
      background: rgba(255,249,238,.78);
      font: 800 15px/1.45 "Trebuchet MS", sans-serif;
    }

    .feedback.show { display: block; }
    .feedback strong { color: var(--red); text-transform: uppercase; letter-spacing: .08em; }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 22px;
      position: relative;
      z-index: 1;
    }

    button.action {
      border: 2px solid var(--green);
      border-radius: 16px;
      padding: 13px 16px;
      background: var(--green);
      color: var(--paper);
      font: 900 13px/1 "Trebuchet MS", sans-serif;
      letter-spacing: .1em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 4px 4px 0 rgba(15,59,47,.3);
    }

    button.action.secondary { background: var(--cream); color: var(--green); }
    button.action.gold { background: var(--gold); color: var(--ink); }
    aside { display: grid; gap: 14px; }

    .panel {
      border: 2px solid var(--green);
      border-radius: 22px;
      padding: 18px;
      background: rgba(255,249,238,.75);
      box-shadow: 8px 8px 0 rgba(15,59,47,.86);
    }

    .panel-title {
      margin: 0 0 10px;
      color: var(--red);
      font: 900 13px/1 "Trebuchet MS", sans-serif;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .meter-label {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      font: 900 12px/1 "Trebuchet MS", sans-serif;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .bar {
      height: 16px;
      border: 2px solid var(--green);
      border-radius: 999px;
      overflow: hidden;
      background: rgba(15,59,47,.12);
    }

    .bar span {
      display: block;
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--gold), var(--red));
      transition: width 240ms ease;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 12px;
    }

    .stat {
      border: 2px solid rgba(15,59,47,.45);
      border-radius: 14px;
      padding: 11px;
      background: rgba(255,255,255,.38);
      font: 900 12px/1.25 "Trebuchet MS", sans-serif;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .stat b {
      display: block;
      margin-top: 5px;
      color: var(--green);
      font-size: 24px;
      letter-spacing: -.04em;
    }

    .review {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 8px;
      max-height: 310px;
      overflow: auto;
    }

    .review li {
      border-left: 5px solid rgba(15,59,47,.3);
      padding: 8px 9px;
      background: rgba(255,255,255,.36);
      font: 800 12px/1.25 "Trebuchet MS", sans-serif;
      cursor: pointer;
    }

    .review li.correct { border-left-color: #1f6c3d; }
    .review li.wrong { border-left-color: var(--red); }
    .review li.current { background: rgba(244,170,25,.25); }

    .final-screen { display: none; position: relative; z-index: 2; }
    .final-screen.show { display: block; }
    .quiz-content.hide { display: none; }

    .final-score {
      margin: 0 0 14px;
      color: var(--green);
      font-size: clamp(48px, 9vw, 110px);
      line-height: .85;
      letter-spacing: -.07em;
    }

    .final-copy {
      max-width: 720px;
      color: var(--muted);
      font: 800 18px/1.45 "Trebuchet MS", sans-serif;
    }

    @media (max-width: 900px) {
      header, .layout { grid-template-columns: 1fr; }
      .score-card { text-align: left; }
      aside { order: -1; }
      .quiz-card { min-height: auto; }
      .review { max-height: 150px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <p class="eyebrow">Practice Mode</p>
        <h1>Renal Outline Quiz</h1>
      </div>
      <div class="score-card" id="scoreCard">Score: 0 / 0<br>Answered: 0</div>
      <nav class="quiz-nav" aria-label="Quiz pages">
        <a href="./">Machine Quiz</a>
        <a href="./renal.html" aria-current="page">Renal Outline Quiz</a>
      </nav>
    </header>

    <section class="layout">
      <article class="quiz-card">
        <div class="quiz-content" id="quizContent">
          <div class="tag-row"><span class="chip" id="category">Category</span><span id="counter">Question 1 / 1</span></div>
          <h2 class="question" id="question"></h2>
          <div class="choices" id="choices"></div>
          <div class="feedback" id="feedback"></div>
          <div class="actions">
            <button class="action secondary" id="prevBtn">Previous</button>
            <button class="action" id="nextBtn">Next</button>
            <button class="action gold" id="shuffleBtn">Shuffle & Restart</button>
          </div>
        </div>
        <div class="final-screen" id="finalScreen">
          <p class="eyebrow">Quiz Complete</p>
          <h2 class="final-score" id="finalScore">0%</h2>
          <p class="final-copy" id="finalCopy"></p>
          <div class="actions">
            <button class="action gold" id="restartBtn">Restart Quiz</button>
            <button class="action secondary" id="reviewBtn">Review Missed</button>
          </div>
        </div>
      </article>

      <aside>
        <div class="panel">
          <div class="meter-label"><span>Progress</span><span id="progressText">0%</span></div>
          <div class="bar"><span id="progressBar"></span></div>
          <div class="stats">
            <div class="stat">Correct<b id="correctStat">0</b></div>
            <div class="stat">Missed<b id="wrongStat">0</b></div>
          </div>
        </div>
        <div class="panel">
          <p class="panel-title">Question Map</p>
          <ol class="review" id="reviewList"></ol>
        </div>
        <div class="panel">
          <p class="panel-title">How To Use</p>
          <p class="final-copy" style="font-size:13px;margin:0">Pick an answer for instant feedback. Use Next to continue. Keyboard shortcuts: 1-4, arrows, R.</p>
        </div>
      </aside>
    </section>
  </main>

  <script>
    const questions = [
      { category: "Renal Anatomy", q: "Which renal vessel relationship is correct?", choices: ["Right renal artery is longer and right renal vein is shorter", "Right renal artery is shorter and right renal vein is longer", "Both renal arteries are equal length", "Left renal vein is shorter than the right renal vein"], answer: 0, why: "The outline notes a longer right renal artery and shorter right renal vein; the left side has the shorter artery and longer vein." },
      { category: "Renal Anatomy", q: "Compression of the left renal vein is associated with what pathologic concept in the outline?", choices: ["Page kidney", "Nutcracker pathology", "Horseshoe kidney", "Ureterocele"], answer: 1, why: "The outline flags left renal vein compression as a nutcracker-type pathology." },
      { category: "Kidney Regions", q: "What is found in the outer renal cortex?", choices: ["Renal pyramids only", "Glomeruli, convoluted tubules, and blood vessels", "Only collecting ducts", "Papillae and calyces only"], answer: 1, why: "The cortex contains glomeruli, convoluted tubules of the nephron, and blood vessels." },
      { category: "Kidney Regions", q: "The inner medulla contains which structures?", choices: ["Renal pyramids and renal columns", "Only Bowman's capsules", "Only afferent arterioles", "Only bladder trigone tissue"], answer: 0, why: "The medulla contains renal pyramids, papillae, and renal columns between pyramids." },
      { category: "Nephron", q: "The renal corpuscle is made up of what two structures?", choices: ["Proximal and distal tubules", "Collecting duct and papilla", "Glomerular capsule and glomerulus", "Ureter and renal pelvis"], answer: 2, why: "The renal corpuscle consists of the glomerular capsule, also called Bowman's capsule, and the glomerulus." },
      { category: "Nephron", q: "The glomerulus is best described as what?", choices: ["A capillary sandwiched between arterioles", "A vein draining the collecting duct", "A muscular tube in the ureter", "A lymphatic channel in the cortex"], answer: 0, why: "The outline describes the glomerulus as a capillary between afferent and efferent arterioles, like a portal system." },
      { category: "Renal Blood Flow", q: "Which arteriole feeds the glomerulus and is normally larger?", choices: ["Efferent arteriole", "Afferent arteriole", "Interlobar arteriole", "Vasa recta"], answer: 1, why: "The afferent arteriole feeds the glomerulus and is larger than the efferent arteriole." },
      { category: "Renal Blood Flow", q: "After leaving the glomerulus, the efferent arteriole becomes what?", choices: ["Peritubular capillaries", "Renal pelvis", "A collecting duct", "A ureteral valve"], answer: 0, why: "The efferent arteriole becomes peritubular capillaries surrounding the PCT, loop of Henle, and DCT." },
      { category: "Urine Formation", q: "Which sequence best summarizes urine formation?", choices: ["Filtration, tubular reabsorption/secretion, and urine concentration", "Ventilation, diffusion, and perfusion", "Bile production, storage, and excretion", "Hemolysis, coagulation, and fibrinolysis"], answer: 0, why: "The outline lists glomerular filtration, tubular reabsorption and secretion, and urine concentration." },
      { category: "JGA", q: "Where is the juxtaglomerular apparatus located?", choices: ["Where the ureter enters the bladder", "Where the DCT returns to its glomerulus", "Inside the renal pelvis only", "At the renal capsule surface"], answer: 1, why: "The JGA is where the distal convoluted tubule comes back to, or 'kisses,' the glomerulus." },
      { category: "Filtration", q: "Net filtration pressure in the glomerulus normally favors what?", choices: ["Fluid movement out of the capillary into Bowman's space", "Protein movement into urine", "Fluid movement into the glomerular capillary", "Complete cessation of filtration"], answer: 0, why: "The glomerulus is a capillary bed where net filtration pressure favors fluid moving out." },
      { category: "Filtrate", q: "Initial glomerular filtrate is essentially what?", choices: ["Whole blood with cells", "Protein-free plasma without cells", "Concentrated urine", "Lymph with red blood cells"], answer: 1, why: "Because of the glomerular filtration barrier, the initial filtrate is essentially protein-free plasma with no cells." },
      { category: "Filtration Barrier", q: "Which structures are part of the glomerular filtration barrier?", choices: ["Capillary endothelium, basement membrane, and podocytes", "Ureter, trigone, and urethra", "Renal pelvis, calyx, and bladder", "Alveoli, bronchioles, and pleura"], answer: 0, why: "The outline lists leaky capillary endothelium, basement membrane, podocytes, foot processes, and mesangium." },
      { category: "Filtration Barrier", q: "What roles does the mesangium have?", choices: ["Only stores urine", "Produces bile acids", "Produces filter protein and has phagocytic and contractile roles", "Only secretes aldosterone"], answer: 2, why: "Mesangial cells help produce filter protein and have phagocytic and contractile roles." },
      { category: "GFR", q: "What average GFR value is listed in the outline?", choices: ["About 12.5 mL/min", "About 125 mL/min", "About 1.25 L/min", "About 3 L/min"], answer: 1, why: "The average GFR listed is approximately 125 mL/min." },
      { category: "GFR", q: "What happens to GFR when glomerular capillary pressure rises?", choices: ["GFR increases", "GFR decreases to zero", "GFR is unrelated to pressure", "Protein filtration stops completely"], answer: 0, why: "Higher pressure inside glomerular capillaries increases GFR." },
      { category: "Arteriole Tone", q: "Afferent arteriole vasodilation tends to do what?", choices: ["Decrease volume and pressure in the glomerulus", "Increase glomerular pressure and GFR", "Block filtrate flow through the ureter", "Prevent renin release forever"], answer: 1, why: "Afferent vasodilation increases blood entering the glomerulus, raising volume, pressure, and GFR." },
      { category: "Arteriole Tone", q: "Mild efferent arteriole constriction generally does what?", choices: ["Raises glomerular pressure while renal blood flow falls", "Always decreases glomerular pressure", "Stops filtration at the basement membrane", "Makes urine isotonic immediately"], answer: 0, why: "Efferent constriction creates a traffic jam behind the glomerulus, increasing glomerular pressure but reducing flow." },
      { category: "NFP", q: "In the NFP equation, what does PGC do?", choices: ["Pulls fluid into capillaries and lowers GFR", "Pushes fluid out and increases GFR", "Represents protein in Bowman's space", "Measures bladder pressure"], answer: 1, why: "PGC is glomerular capillary hydrostatic pressure; it pushes fluid out and increases GFR." },
      { category: "NFP", q: "What effect does Bowman's space pressure have on GFR?", choices: ["It pushes back and lowers GFR", "It always increases GFR", "It becomes albumin", "It only changes urine pH"], answer: 0, why: "PBS is pressure in Bowman's space; it opposes filtration and decreases GFR." },
      { category: "NFP", q: "What effect does glomerular oncotic pressure have?", choices: ["It pulls fluid into the glomerular capillary and decreases GFR", "It pushes fluid into Bowman's space", "It only affects ureteral peristalsis", "It creates renal stones"], answer: 0, why: "Albumin in glomerular capillaries creates oncotic pressure that pulls fluid inward and lowers GFR." },
      { category: "GFR Control", q: "In practice, GFR is mainly controlled by what?", choices: ["Bladder size", "Changes in glomerular hydrostatic pressure through arteriole tone", "Urine color only", "Renal capsule thickness only"], answer: 1, why: "The outline emphasizes arteriole vasodilation or constriction as the practical controller of glomerular hydrostatic pressure and GFR." },
      { category: "SNS", q: "Sympathetic nervous system activation does what to renal circulation?", choices: ["Dilates afferent arterioles and increases GFR", "Constrains the bladder only", "Constriction of afferent arteriole, decreased RBF/GFR, and increased renin", "Increases urine protein filtration"], answer: 2, why: "SNS activation constricts the afferent arteriole, decreasing renal blood flow and GFR while increasing renin." },
      { category: "SNS", q: "Which situation can activate the renal sympathetic response listed in the outline?", choices: ["Hemorrhage, hypotension, or anesthesia-related MAP decrease", "High urine specific gravity only", "Eating calcium stones", "Increased bladder capacity"], answer: 0, why: "The outline lists hemorrhage, hypotension, and anesthesia through decreased MAP." },
      { category: "PCT", q: "About how much of all tubular reabsorptive and secretory activity occurs in the PCT?", choices: ["5%", "20%", "65%", "100%"], answer: 2, why: "The proximal tubule handles about 65% of all reabsorptive and secretory processes." },
      { category: "PCT", q: "What is true about glucose handling in the PCT?", choices: ["It is normally almost completely reabsorbed until transport maximum is exceeded", "It is never reabsorbed", "It is secreted only by the collecting duct", "It appears in urine only when GFR is zero"], answer: 0, why: "Glucose is almost completely reabsorbed until the transport maximum or renal threshold is surpassed." },
      { category: "PCT", q: "What plasma glucose renal threshold is listed in the outline?", choices: ["About 80 mg/dL", "About 120 mg/dL", "About 180 mg/dL", "About 320 mg/dL"], answer: 2, why: "The renal threshold for glucose is listed as about 180 mg/dL." },
      { category: "PCT", q: "Why does bulk water reabsorption occur in the PCT?", choices: ["Electrolyte reabsorption causes osmotic water reabsorption", "Water is actively pumped against sodium", "The PCT is impermeable to electrolytes", "Only ADH works in the PCT"], answer: 0, why: "Reabsorbed electrolytes create osmotic movement of water back toward peritubular capillaries." },
      { category: "Loop of Henle", q: "The loop of Henle, taken as a whole, reabsorbs more of what than water?", choices: ["Protein and glucose", "Na+ and Cl-", "Urea and ammonia only", "Albumin and red blood cells"], answer: 1, why: "The loop of Henle reabsorbs more sodium and chloride than water, helping dilute urine." },
      { category: "Loop of Henle", q: "Which diuretics act at the loop of Henle?", choices: ["Loop diuretics", "Thiazide diuretics only", "Potassium-sparing diuretics only", "Carbonic acid absorbents"], answer: 0, why: "The outline identifies the loop of Henle as the site of action for loop diuretics." },
      { category: "Loop of Henle", q: "About how much filtered Na+, K+, and Cl- is reabsorbed in the thick loop of Henle?", choices: ["1% to 2%", "5%", "20% to 25%", "65% to 80%"], answer: 2, why: "The thick loop reabsorbs about 20% to 25% of the filtered load of Na+, K+, and Cl-." },
      { category: "DCT", q: "Which diuretics act at the DCT?", choices: ["Thiazide diuretics", "Loop diuretics only", "Osmotic gas scavengers", "No diuretics act there"], answer: 0, why: "The DCT is listed as the site of action of thiazide diuretics." },
      { category: "DCT", q: "DCT calcium reabsorption is driven mainly by what hormone?", choices: ["Insulin", "Parathyroid hormone", "Erythropoietin", "ADH only"], answer: 1, why: "The outline states calcium is actively reabsorbed in the DCT under parathyroid hormone influence." },
      { category: "DCT", q: "Aldosterone in the DCT promotes what pattern?", choices: ["Na+ reabsorption and K+ elimination", "K+ reabsorption and Na+ elimination", "Protein filtration", "Albumin secretion"], answer: 0, why: "The DCT fine-tunes sodium reabsorption and potassium elimination under aldosterone." },
      { category: "Collecting Duct", q: "ADH increases collecting duct water permeability by causing insertion of what channels?", choices: ["Aquaporin-2 channels", "Voltage-gated sodium channels", "Hemoglobin channels", "Urease channels"], answer: 0, why: "ADH binds vasopressin receptors and causes aquaporin-2 water channels." },
      { category: "Renal Blood Flow", q: "Kidneys receive about what fraction of cardiac output?", choices: ["2% to 5%", "10%", "20% to 25%", "60%"], answer: 2, why: "The outline states kidneys get about 20% to 25% of cardiac output." },
      { category: "JGA", q: "Which JGA cells monitor sodium chloride in distal tubular filtrate?", choices: ["Macula densa cells", "Podocytes", "Mesangial matrix cells only", "Red blood cells"], answer: 0, why: "Macula densa cells are specialized DCT cells that monitor sodium chloride concentration." },
      { category: "JGA", q: "Juxtaglomerular cells are specialized cells of which structure and contain what?", choices: ["Afferent arteriole; renin", "Collecting duct; ADH", "Ureter; urea", "Bladder; creatinine"], answer: 0, why: "JG cells are specialized afferent arteriole cells and contain renin." },
      { category: "Urinalysis", q: "A urine specific gravity close to 1.000 suggests what?", choices: ["Very concentrated urine", "Dilute urine", "Large protein loss", "Guaranteed renal failure"], answer: 1, why: "Specific gravity closer to 1.000 indicates dilute urine." },
      { category: "Urinalysis", q: "Healthy kidneys can produce concentrated urine around what specific gravity range?", choices: ["1.000 to 1.005", "1.010 to 1.015", "1.030 to 1.040", "2.000 to 3.000"], answer: 2, why: "The outline lists concentrated urine around 1.030 to 1.040." },
      { category: "Urinalysis", q: "Urobilinogen is a breakdown product of what?", choices: ["Hemoglobin", "Creatinine", "Phosphate", "Albumin"], answer: 0, why: "Urobilinogen is produced from hemoglobin breakdown." },
      { category: "Urinalysis", q: "High urobilinogen can suggest what process?", choices: ["RBCs breaking down too quickly", "No hemoglobin turnover", "Low urine pH only", "Ureteral obstruction only"], answer: 0, why: "The outline connects high urobilinogen with rapid RBC breakdown, such as hemolytic anemia." },

      { category: "Prerenal AKI", q: "Which is a prerenal AKI cause?", choices: ["Hypovolemia from hemorrhage, dehydration, GI loss, or burns", "Bilateral ureteral obstruction only", "Bladder cancer only", "Cystine transporter mutation"], answer: 0, why: "Prerenal AKI is caused by reduced perfusion, including hypovolemia from hemorrhage, dehydration, GI losses, or burns." },
      { category: "Prerenal AKI", q: "Which shock state can contribute to prerenal AKI by decreasing vascular filling?", choices: ["Anaphylactic or septic shock", "Only renal colic", "Only minimal change disease", "Only high urine pH"], answer: 0, why: "The outline lists anaphylactic shock and septic shock under decreased vascular filling." },

      { category: "Intrarenal AKI", q: "Intrarenal obstruction can result from casts or pigments such as what?", choices: ["Hemoglobinuria, myoglobinuria, myeloma light chains, or uric acid casts", "Only urobilinogen", "Only sodium chloride", "Only leukocyte esterase"], answer: 0, why: "The outline lists intratubular obstruction from hemoglobinuria, myoglobinuria, myeloma light chains, or uric acid casts." },
      { category: "Postrenal AKI", q: "Which is a postrenal AKI cause?", choices: ["Bilateral ureteral obstruction or bladder outlet obstruction", "Hypovolemia from burns", "Reduced EPO production", "Podocyte foot process loss"], answer: 0, why: "Postrenal AKI includes bilateral ureteral obstruction and bladder outlet obstruction such as prostate enlargement or bladder cancer." },
      { category: "Recognizing AKI", q: "What is an early indicator of AKI, especially prerenal causes?", choices: ["Oliguria", "Frothy urine only", "High ACR only", "Bone tenderness"], answer: 0, why: "Careful observation of urine output is important; oliguria is an early indicator, especially in prerenal causes." },
      { category: "Recognizing AKI", q: "Why can BUN and creatinine be delayed indicators of AKI?", choices: ["They lag relative to injury", "They rise before injury occurs", "They are unrelated to kidney function", "They only measure calcium"], answer: 0, why: "The outline states BUN and creatinine lag relative to injury, with creatinine affected by hemodynamics and urea production delayed/inconsistent." }
    ];

    let deck = [...questions];
    let current = 0;
    let answers = Array(deck.length).fill(null);

    const scoreCard = document.getElementById('scoreCard');
    const categoryEl = document.getElementById('category');
    const counterEl = document.getElementById('counter');
    const questionEl = document.getElementById('question');
    const choicesEl = document.getElementById('choices');
    const feedbackEl = document.getElementById('feedback');
    const progressText = document.getElementById('progressText');
    const progressBar = document.getElementById('progressBar');
    const correctStat = document.getElementById('correctStat');
    const wrongStat = document.getElementById('wrongStat');
    const reviewList = document.getElementById('reviewList');
    const quizContent = document.getElementById('quizContent');
    const finalScreen = document.getElementById('finalScreen');
    const finalScore = document.getElementById('finalScore');
    const finalCopy = document.getElementById('finalCopy');

    function counts() {
      const answered = answers.filter(answer => answer !== null).length;
      const correct = answers.filter((answer, i) => answer === deck[i].answer).length;
      const wrong = answers.filter((answer, i) => answer !== null && answer !== deck[i].answer).length;
      return { answered, correct, wrong };
    }

    function render() {
      const item = deck[current];
      const picked = answers[current];
      categoryEl.textContent = item.category;
      counterEl.textContent = `Question ${current + 1} / ${deck.length}`;
      questionEl.textContent = item.q;
      choicesEl.replaceChildren();

      item.choices.forEach((choice, i) => {
        const button = document.createElement('button');
        button.className = 'choice';
        if (picked !== null && i === item.answer) button.classList.add('correct');
        if (picked !== null && i === picked && picked !== item.answer) button.classList.add('wrong');
        button.dataset.i = i;
        button.disabled = picked !== null;

        const letter = document.createElement('span');
        letter.className = 'letter';
        letter.textContent = String.fromCharCode(65 + i);

        const text = document.createElement('span');
        text.textContent = choice;

        button.append(letter, text);
        choicesEl.append(button);
      });

      if (picked === null) {
        feedbackEl.className = 'feedback';
        feedbackEl.replaceChildren();
      } else {
        const correct = picked === item.answer;
        feedbackEl.className = 'feedback show';
        feedbackEl.replaceChildren();
        const strong = document.createElement('strong');
        strong.textContent = correct ? 'Correct' : 'Missed';
        const explanation = document.createElement('div');
        explanation.textContent = item.why;
        feedbackEl.append(strong, document.createElement('br'), explanation);
      }

      const stats = counts();
      const pct = Math.round((stats.answered / deck.length) * 100);
      progressText.textContent = `${pct}%`;
      progressBar.style.width = `${pct}%`;
      correctStat.textContent = stats.correct;
      wrongStat.textContent = stats.wrong;
      scoreCard.innerHTML = `Score: ${stats.correct} / ${deck.length}<br>Answered: ${stats.answered}`;
      renderReview();
    }

    function renderReview() {
      reviewList.replaceChildren();
      deck.forEach((item, i) => {
        const li = document.createElement('li');
        if (i === current) li.classList.add('current');
        if (answers[i] !== null && answers[i] === item.answer) li.classList.add('correct');
        if (answers[i] !== null && answers[i] !== item.answer) li.classList.add('wrong');
        li.dataset.i = i;
        li.textContent = `${i + 1}. ${item.category}`;
        reviewList.append(li);
      });
    }

    function choose(index) {
      if (answers[current] !== null) return;
      answers[current] = index;
      render();
      if (answers.every(answer => answer !== null)) {
        setTimeout(showFinal, 500);
      }
    }

    function next() {
      if (current < deck.length - 1) current += 1;
      else if (answers.every(answer => answer !== null)) return showFinal();
      render();
    }

    function prev() {
      if (current > 0) current -= 1;
      render();
    }

    function showFinal() {
      const stats = counts();
      const pct = Math.round((stats.correct / deck.length) * 100);
      finalScore.textContent = `${pct}%`;
      finalCopy.textContent = `You answered ${stats.correct} of ${deck.length} correctly. Use review to revisit missed topics, then restart when ready.`;
      quizContent.classList.add('hide');
      finalScreen.classList.add('show');
    }

    function hideFinal() {
      quizContent.classList.remove('hide');
      finalScreen.classList.remove('show');
    }

    function restart(shuffle = false) {
      if (shuffle) {
        for (let i = deck.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [deck[i], deck[j]] = [deck[j], deck[i]];
        }
      }
      current = 0;
      answers = Array(deck.length).fill(null);
      hideFinal();
      render();
    }

    choicesEl.addEventListener('click', event => {
      const button = event.target.closest('.choice');
      if (!button) return;
      choose(Number(button.dataset.i));
    });

    reviewList.addEventListener('click', event => {
      const item = event.target.closest('li');
      if (!item) return;
      current = Number(item.dataset.i);
      hideFinal();
      render();
    });

    document.getElementById('nextBtn').addEventListener('click', next);
    document.getElementById('prevBtn').addEventListener('click', prev);
    document.getElementById('shuffleBtn').addEventListener('click', () => restart(true));
    document.getElementById('restartBtn').addEventListener('click', () => restart(false));
    document.getElementById('reviewBtn').addEventListener('click', () => {
      current = answers.findIndex((answer, i) => answer !== null && answer !== deck[i].answer);
      if (current < 0) current = 0;
      hideFinal();
      render();
    });

    document.addEventListener('keydown', event => {
      if (event.key === 'ArrowRight') next();
      if (event.key === 'ArrowLeft') prev();
      if (/^[1-4]$/.test(event.key)) choose(Number(event.key) - 1);
      if (event.key.toLowerCase() === 'r') restart(false);
    });

    render();
  </script>
</body>
</html>
