<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exam Quizzes</title>
  <style>
    :root {
      --ink: #101410;
      --paper: #f7efe0;
      --cream: #fff9ee;
      --green: #0f3b2f;
      --gold: #f4aa19;
      --red: #b94a34;
      --blue: #243f70;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at 14% 16%, rgba(244, 170, 25, 0.34), transparent 28%),
        radial-gradient(circle at 86% 12%, rgba(36, 63, 112, 0.17), transparent 28%),
        linear-gradient(135deg, #fbf4e7, #dcc596);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.18;
      background-image:
        linear-gradient(90deg, rgba(15,59,47,.14) 1px, transparent 1px),
        linear-gradient(rgba(15,59,47,.1) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: radial-gradient(circle at center, black, transparent 80%);
    }

    main {
      position: relative;
      width: min(980px, calc(100vw - 30px));
      margin: 0 auto;
      padding: 42px 0;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--red);
      font: 800 12px/1 "Trebuchet MS", sans-serif;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 26px;
      color: var(--green);
      font-size: clamp(48px, 9vw, 112px);
      line-height: .86;
      letter-spacing: -.065em;
    }

    .quiz-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .quiz-card {
      min-height: 220px;
      border: 3px solid var(--green);
      border-radius: 30px;
      padding: 26px;
      background:
        linear-gradient(145deg, rgba(255,255,255,.65), transparent 34%),
        repeating-linear-gradient(0deg, rgba(15,59,47,.055) 0 1px, transparent 1px 22px),
        var(--paper);
      box-shadow: 10px 10px 0 rgba(15, 59, 47, 0.92), 0 24px 70px rgba(15, 59, 47, 0.18);
      color: var(--green);
      text-decoration: none;
      transition: transform 120ms ease, box-shadow 120ms ease;
    }

    .quiz-card:hover {
      transform: translate(-2px, -2px);
      box-shadow: 13px 13px 0 rgba(15, 59, 47, 0.92), 0 24px 70px rgba(15, 59, 47, 0.18);
    }

    .quiz-card span {
      display: inline-block;
      margin-bottom: 16px;
      border: 2px solid var(--blue);
      border-radius: 999px;
      padding: 7px 10px;
      color: var(--blue);
      background: rgba(244,170,25,.18);
      font: 900 12px/1 "Trebuchet MS", sans-serif;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .quiz-card strong {
      display: block;
      font-size: clamp(30px, 5vw, 54px);
      line-height: .9;
      letter-spacing: -.045em;
    }

    .quiz-card p {
      margin: 14px 0 0;
      color: rgba(16, 20, 16, 0.68);
      font: 800 15px/1.45 "Trebuchet MS", sans-serif;
    }

    @media (max-width: 760px) {
      .quiz-list { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Practice Mode</p>
    <h1>Exam Quizzes</h1>
    <section class="quiz-list" aria-label="Available quizzes">
      <a class="quiz-card" href="./machine.html">
        <span>Machine</span>
        <strong>Machine Quiz</strong>
        <p>CO2 absorption, humidification, filtration, and machine concepts.</p>
      </a>
      <a class="quiz-card" href="./renal.html">
        <span>Renal</span>
        <strong>Renal Outline Quiz</strong>
        <p>Renal anatomy, physiology, filtration, and related outline topics.</p>
      </a>
    </section>
  </main>
</body>
</html>
